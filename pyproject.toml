[tool.poetry]
name = "easy_chatbot"
version = "0.1.0"
description = "API para crear un chatbot contextual a partir de documentos, usando Ollama y LangChain"
authors = ["Tu Nombre <tu@email.com>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.10"

# API y servidor
fastapi = "^0.110.2"
uvicorn = {extras = ["standard"], version = "^0.29.0"}
python-multipart = "^0.0.9"

# LLMs y procesamiento
langchain = "^0.1.16"
langgraph = "^0.0.38"
ollama = "^0.1.7"

# Document loaders y parseo
pypdf = "^3.17.4"
python-docx = "^1.1.0"

# Vector store (local)
faiss-cpu = "^1.7.4"
sentence-transformers = "^2.6.1"  # opcional, embeddings

# Utilidades
python-dotenv = "^1.0.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
